<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Loris & Marisa - Crossplatform Wilderness</title>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100%; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        
        /* Schermata Iniziale */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; cursor: pointer; }
        #start-screen h1 { margin: 0 0 10px 0; font-size: 26px; }
        #start-screen p { margin: 5px 0; font-size: 14px; color: #ddd; }

        /* HUD & Menu Costruzione */
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-weight: bold; text-shadow: 1px 1px 3px black; z-index: 10; font-size: 12px; pointer-events: none; }
        #build-menu { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; }
        .build-btn { padding: 10px 14px; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px); }
        .build-btn:active { background: #2e7d32; }

        /* Controlli Touch per iPhone */
        .touch-pad { position: absolute; bottom: 25px; width: 100px; height: 100px; border-radius: 50px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; z-index: 10; touch-action: none; }
        #touch-move { left: 20px; }
        #touch-look { right: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">Loris & Marisa Wilderness</div>

    <div id="build-menu">
        <button class="build-btn" onclick="buildStructure('tent')">⛺ Tenda (E)</button>
        <button class="build-btn" onclick="buildStructure('fire')">🔥 Fuoco (F)</button>
    </div>

    <!-- Pulsanti Touch per iOS -->
    <div id="touch-move" class="touch-pad">AVANTI</div>
    <div id="touch-look" class="touch-pad">GIRA</div>

    <div id="start-screen">
        <h1>Loris & Marisa Wilderness</h1>
        <p><strong>PC:</strong> Clicca per giocare (WASD + Mouse)</p>
        <p><strong>iPhone:</strong> Tocca per iniziare (Usa i pulsanti touch)</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Illuminazione
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(30, 50, 20);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x666666));

        // Terreno
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(250, 250),
            new THREE.MeshLambertMaterial({ color: 0x2e5a1c })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Alberi
        for (let i = 0; i < 50; i++) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 3), new THREE.MeshLambertMaterial({ color: 0x4a2e12 }));
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 5), new THREE.MeshLambertMaterial({ color: 0x133b11 }));
            const x = (Math.random() - 0.5) * 180;
            const z = (Math.random() - 0.5) * 180;
            if (Math.hypot(x, z) > 8) {
                trunk.position.set(x, 1.5, z);
                leaves.position.set(x, 4.5, z);
                scene.add(trunk);
                scene.add(leaves);
            }
        }

        // Gestione Stato Gioco
        let isStarted = false;
        let yaw = 0, pitch = 0;
        const keys = {};

        const startScreen = document.getElementById('start-screen');
        
        function startGame(e) {
            startScreen.style.display = 'none';
            isStarted = true;
            // Tenta il lock del mouse solo se si usa il PC (evento click)
            if (e.type === 'click' && document.body.requestPointerLock) {
                document.body.requestPointerLock();
            }
        }

        startScreen.addEventListener('click', startGame);
        startScreen.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startGame(e);
        });

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement) {
                startScreen.style.display = 'flex';
                isStarted = false;
            }
        });

        // Controlli MOUSE (PC)
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.0025;
                pitch -= e.movementY * 0.0025;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        // Controlli TASTIERA (PC)
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE') buildStructure('tent');
            if (e.code === 'KeyF') buildStructure('fire');
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Controlli TOUCH (iPhone)
        let touchMoving = false;
        let touchTurning = false;

        const btnMove = document.getElementById('touch-move');
        const btnLook = document.getElementById('touch-look');

        btnMove.addEventListener('touchstart', (e) => { e.preventDefault(); touchMoving = true; });
        btnMove.addEventListener('touchend', (e) => { e.preventDefault(); touchMoving = false; });

        btnLook.addEventListener('touchstart', (e) => { e.preventDefault(); touchTurning = true; });
        btnLook.addEventListener('touchend', (e) => { e.preventDefault(); touchTurning = false; });

        // Funzione Costruzione (Funziona sia con Touch che Tastiera/Mouse)
        function buildStructure(type) {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const pos = camera.position.clone().add(dir.multiplyScalar(3));
            pos.y = 0;

            if (type === 'tent') {
                const tent = new THREE.Mesh(
                    new THREE.ConeGeometry(1.5, 2.2, 4),
                    new THREE.MeshLambertMaterial({ color: 0x8b4513 })
                );
                tent.position.set(pos.x, 1.1, pos.z);
                tent.rotation.y = camera.rotation.y;
                scene.add(tent);
            } else if (type === 'fire') {
                const fireLight = new THREE.PointLight(0xff6600, 2.5, 12);
                fireLight.position.set(pos.x, 0.6, pos.z);
                scene.add(fireLight);

                const base = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.5, 0.2),
                    new THREE.MeshLambertMaterial({ color: 0x333333 })
                );
                base.position.set(pos.x, 0.1, pos.z);
                scene.add(base);
            }
        }

        // Loop di Animazione
        const moveSpeed = 0.12;
        function animate() {
            requestAnimationFrame(animate);

            if (isStarted) {
                // Rotazione Touch (iPhone)
                if (touchTurning) {
                    yaw -= 0.03;
                    camera.rotation.set(pitch, yaw, 0, 'YXZ');
                }

                // Calcolo Direzione
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                side.y = 0; side.normalize();

                // Movimento Tastiera (PC)
                if (keys['KeyW']) camera.position.addScaledVector(forward, moveSpeed);
                if (keys['KeyS']) camera.position.addScaledVector(forward, -moveSpeed);
                if (keys['KeyA']) camera.position.addScaledVector(side, -moveSpeed);
                if (keys['KeyD']) camera.position.addScaledVector(side, moveSpeed);

                // Movimento Touch (iPhone)
                if (touchMoving) {
                    camera.position.addScaledVector(forward, moveSpeed);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
