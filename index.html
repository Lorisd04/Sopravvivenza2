<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World Explorer</title>
    <!-- Favicon inline per prevenire errori 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Libreria Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Canvas del gioco -->
    <div id="game-container"></div>

    <!-- UI Overlay / HUD -->
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-card">
                <span class="hud-label">Monete:</span>
                <span id="score" class="hud-value">0 / 10</span>
            </div>
            <div class="hud-card">
                <span class="hud-label">Posizione:</span>
                <span id="pos-display" class="hud-value">X: 0, Z: 0</span>
            </div>
        </div>

        <div id="controls-hint">
            <p><strong>Controlli:</strong></p>
            <p>⌨️ <b>WASD / Frecce</b>: Muovi Personaggio</p>
            <p>SPACE <b>Spazio</b>: Salta</p>
            <p>🖱️ <b>Trascina Mouse</b>: Ruota Telecamera</p>
            <p>🔘 <b>Rotella</b>: Zoom Telecamera</p>
        </div>

        <div id="interaction-prompt" class="hidden">
            Premi <kbd>E</kbd> per parlare
        </div>

        <div id="dialog-box" class="hidden">
            <div id="dialog-speaker">NPC</div>
            <div id="dialog-text">Ciao avventuriero!</div>
            <button id="dialog-close" onclick="closeDialog()">Chiudi</button>
        </div>

        <div id="day-night-btn" onclick="toggleDayNight()">
            🌙 Passa a Notte
        </div>
    </div>

    <!-- Script del gioco -->
    <script src="game.js"></script>
</body>
</html>
