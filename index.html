<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loris & Marisa - Island</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        
        /* Controlli Touch Touch-screen per iPhone */
        .touch-zone { position: absolute; bottom: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 60px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; z-index: 10; }
        #btn-move { left: 20px; }
        #btn-look { right: 20px; }
        #btn-build { position: absolute; top: 20px; right: 20px; padding: 12px 20px; background: #2e7d32; color: white; border: none; border-radius: 20px; font-weight: bold; z-index: 10; }
        #info { position: absolute; top: 20px; left: 20px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">Loris & Marisa 🌲</div>
    <button id="btn-build">⛺ Piazza Tenda</button>
    <div id="btn-move" class="touch-zone">AVANTI</div>
    <div id="btn-look" class="touch-zone">GIRA</div>

    <script>
        // Scena Base Leggera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luce Semplice
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x666666));

        // Prato
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshLambertMaterial({ color: 0x3b7a57 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Alberi di Prova
        for (let i = 0; i < 40; i++) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 5), new THREE.MeshLambertMaterial({ color: 0x1b4d3e }));
            trunk.position.set((Math.random() - 0.5) * 100, 1, (Math.random() - 0.5) * 100);
            leaves.position.set(trunk.position.x, 3.5, trunk.position.z);
            scene.add(trunk);
            scene.add(leaves);
        }

        // Logica Movimento
        let moving = false;
        let turning = false;

        const moveBtn = document.getElementById('btn-move');
        const lookBtn = document.getElementById('btn-look');

        moveBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moving = true; });
        moveBtn.addEventListener('touchend', (e) => { e.preventDefault(); moving = false; });
        
        lookBtn.addEventListener('touchstart', (e) => { e.preventDefault(); turning = true; });
        lookBtn.addEventListener('touchend', (e) => { e.preventDefault(); turning = false; });

        // Costruzione
        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const tent = new THREE.Mesh(
                new THREE.ConeGeometry(1.5, 2, 4),
                new THREE.MeshLambertMaterial({ color: 0x964b00 })
            );
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            tent.position.copy(camera.position).add(dir.multiplyScalar(3));
            tent.position.y = 1;
            scene.add(tent);
        });

        // Loop di Gioco
        function animate() {
            requestAnimationFrame(animate);

            if (turning) {
                camera.rotation.y -= 0.03;
            }

            if (moving) {
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();
                camera.position.addScaledVector(dir, 0.1);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
